apis:
  identity:
    root: src/identity.yaml
  usecases:
    root: src/usecases.yaml
  appetite:
    root: src/appetite.yaml
  fairness:
    root: src/fairness.yaml
  assessments:
    root: src/assessments.yaml
  controls:
    root: src/controls.yaml
  monitoring:
    root: src/monitoring.yaml
  predictions:
    root: src/predictions.yaml
  governance:
    root: src/governance.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
