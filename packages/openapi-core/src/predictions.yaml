openapi: 3.1.0
info:
  title: Predictions API
  version: 0.1.0
  description: |
    Forecast appetite/fairness threshold breaches before board pack lock (BR-8).
  x-domain: prd
  x-product-slug: ai-cyber-appetitebind
servers:
  - url: https://api.appetitebind.local
security:
  - apiKey: []
tags:
  - name: Predictions
    description: Leading-indicator breach forecasts
paths:
  /v1/predictions/breaches:
    get:
      operationId: listBreachPredictions
      tags: [Predictions]
      summary: List breach predictions
      security:
        - apiKey: []
        - bearerAuth: []
      x-repository: BreachPrediction
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: useCaseId
          in: query
          schema:
            $ref: ./predictions.schemas.yaml#/components/schemas/UseCaseId
        - name: status
          in: query
          schema:
            type: string
            enum: [open, actioned, realised, dismissed]
      responses:
        '200':
          description: Predicted appetite or fairness breaches
          content:
            application/json:
              schema:
                $ref: ./predictions.schemas.yaml#/components/schemas/BreachPredictionListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/predictions/breaches/run:
    post:
      operationId: runBreachPrediction
      tags: [Predictions]
      summary: Run breach prediction
      description: >
        Forecast approaching appetite or fairness threshold breaches from
        leading indicators before the board pack is finalised.
      security:
        - apiKey: []
        - bearerAuth: []
      x-repository: BreachPrediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./predictions.schemas.yaml#/components/schemas/RunBreachPredictionRequest
      responses:
        '200':
          description: Prediction run complete
          content:
            application/json:
              schema:
                $ref: ./predictions.schemas.yaml#/components/schemas/BreachPredictionListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/predictions/breaches/{predictionId}/action:
    parameters:
      - name: predictionId
        in: path
        required: true
        schema:
          $ref: ./predictions.schemas.yaml#/components/schemas/PredictionId
    post:
      operationId: actionBreachPrediction
      tags: [Predictions]
      summary: Action a breach prediction
      security:
        - apiKey: []
        - bearerAuth: []
      x-repository: BreachPrediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./predictions.schemas.yaml#/components/schemas/ActionBreachPredictionRequest
      responses:
        '200':
          description: Prediction actioned
          content:
            application/json:
              schema:
                $ref: ./predictions.schemas.yaml#/components/schemas/BreachPredictionResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
