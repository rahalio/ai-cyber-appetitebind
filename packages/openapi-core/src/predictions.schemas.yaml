openapi: 3.1.0
info:
  title: Predictions schemas
  version: 0.1.0
  description: Leading-indicator breach forecasts.
paths: {}
components:
  schemas:
    UseCaseId:
      type: string
      pattern: '^ucs_[0-9A-HJKMNP-TV-Z]{26}$'
    PredictionId:
      type: string
      pattern: '^prd_[0-9A-HJKMNP-TV-Z]{26}$'

    BreachPrediction:
      type: object

      x-dynamodb:
        entityType: "BREACH_PREDICTION"
        pkPatternTemplate: "BREACH_PREDICTION#${predictionId}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        createdAtField: "createdAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
        gsi1PKPatternTemplate: "USECASE#${useCaseId}"
        gsi1SKPatternTemplate: "BREACH_PREDICTION#${predictionId}"
      required: [predictionId, useCaseId, predictedBreachType, status, createdAt, updatedAt]
      properties:
        predictionId:
          $ref: '#/components/schemas/PredictionId'
        useCaseId:
          $ref: '#/components/schemas/UseCaseId'
        predictedBreachType:
          type: string
          enum: [appetite, fairness, operational_handoff, portfolio_mix]
        probability:
          type: number
          format: float
        predictedBy:
          type: string
          format: date-time
        leadingIndicators:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [open, actioned, realised, dismissed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RunBreachPredictionRequest:
      type: object
      properties:
        useCaseId:
          $ref: '#/components/schemas/UseCaseId'
        horizonDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 30

    ActionBreachPredictionRequest:
      type: object
      required: [action, rationale]
      properties:
        action:
          type: string
          enum: [governance_task, suspend_traffic, reassess, dismiss]
        rationale:
          type: string

    BreachPredictionListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BreachPrediction'
        nextCursor:
          type: string

    BreachPredictionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/BreachPrediction'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    BreachPredictionListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/BreachPredictionListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
