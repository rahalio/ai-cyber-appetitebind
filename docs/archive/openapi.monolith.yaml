      type: object
      required: [version, thresholds]
      properties:
        version:
          type: string
        narrative:
          type: string
        thresholds:
          type: array
          items:
            type: object
            required: [metric, limit]
            properties:
              metric:
                type: string
              limit:
                type: number
                format: float
              segment:
                type: string
        approvedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
    FairnessAssessment:
      type: object
      required: [id, useCaseId, outcome]
