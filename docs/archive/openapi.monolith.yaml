          type: string
          enum: [pass, conditional, fail]
        metrics:
          type: object
          additionalProperties:
            type: number
        vulnerableCustomerConsidered:
          type: boolean
        assessedBy:
          type: string
        assessedAt:
          type: string
          format: date-time
    FairnessAssessmentCreate:
      type: object
      required: [outcome, metrics]
      properties:
